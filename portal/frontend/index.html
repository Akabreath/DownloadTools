<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DownloadTools · 下载工具集合</title>
<link rel="stylesheet" href="static/css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧰</text></svg>">
</head>
<body>
<div class="bg-glow"></div>
<div class="bg-glow glow2"></div>

<header class="topbar glass">
  <div class="logo">
    <span class="logo-ico">🧰</span>
    <div>
      <h1>Download<span class="accent">Tools</span></h1>
      <p class="tagline">下载工具集合 · 一站式下载中心</p>
    </div>
  </div>
  <div class="server-status">
    <span class="dot" id="srvDot"></span>
    <span id="srvText">连接中…</span>
  </div>
</header>

<main>
  <section class="hero">
    <h2>选择你的下载工具</h2>
    <p class="sub">每个工具独立运行，点击卡片即可使用</p>
  </section>

  <section id="toolGrid" class="tool-grid">
    <!-- 工具卡片由 JS 渲染 -->
  </section>

  <section class="card glass soon">
    <div class="soon-ico">🚧</div>
    <div>
      <h3>更多工具即将上线</h3>
      <p>视频下载 · 音乐下载 · 批量抓图 …</p>
    </div>
  </section>
</main>

<footer class="foot">DownloadTools · 下载工具集合门户</footer>

<script src="static/js/app.js"></script>
</body>
</html>
