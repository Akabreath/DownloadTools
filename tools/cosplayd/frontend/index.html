<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>cosplayD · Cosplay 图片下载工具</title>
<script>
/* 主题: 防闪烁, 先于 CSS 生效 */
(function(){
  var t = "auto";
  try { t = localStorage.getItem("dt-theme") || "auto"; } catch (e) {}
  var dark = t === "dark" || (t === "auto" && window.matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.dataset.theme = dark ? "dark" : "light";
})();
</script>
<link rel="stylesheet" href="static/css/style.css?v=20260930">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📸</text></svg>">
</head>
<body>
<div class="bg-glow"></div>
<div class="bg-glow glow2"></div>

<header class="topbar glass">
  <div class="logo">
    <span class="logo-ico">📸</span>
    <div>
      <h1>cosplay<span class="accent">D</span></h1>
      <p class="tagline">Cosplay 页面图片下载工具</p>
    </div>
  </div>
  <div class="header-actions">
    <a class="btn btn-ghost btn-sm" href="/">🏠 返回主页</a>
    <div class="theme-wrap">
      <button class="theme-btn" id="themeBtn" type="button" aria-label="切换主题" title="主题：跟随系统">💻</button>
      <div class="theme-menu" id="themeMenu" hidden>
        <button type="button" data-theme="auto">💻 跟随系统</button>
        <button type="button" data-theme="light">☀️ 亮色</button>
        <button type="button" data-theme="dark">🌙 暗色</button>
      </div>
    </div>
    <div class="server-status">
      <span class="dot" id="srvDot"></span>
      <span id="srvText">连接中…</span>
    </div>
  </div>
</header>

<main>
  <!-- 输入区 -->
  <section class="card glass hero">
    <h2>粘贴页面链接</h2>
    <p class="hint">支持 cosblay 等 WordPress 站点 — 自动提取正文 p 标签下的所有图片</p>
    <div class="input-row">
      <input type="url" id="urlInput" placeholder="https://cosblay.com/151825.html" spellcheck="false">
      <button id="parseBtn" class="btn btn-primary">🔍 解析页面</button>
    </div>
    <div id="parseStatus" class="status-line"></div>
  </section>

  <!-- 结果区 -->
  <section id="resultSection" class="card glass hidden">
    <div class="result-head">
      <div class="title-block">
        <span class="badge">📄</span>
        <h3 id="pageTitle">—</h3>
      </div>
      <div class="stat-pills">
        <span class="pill">🖼 <b id="statCount">0</b> 张图片</span>
        <span class="pill" id="statSize">—</span>
      </div>
    </div>

    <!-- 下载设置 -->
    <div class="settings">
      <div class="setting-group">
        <span class="set-label">格式</span>
        <div class="seg" id="fmtSeg">
          <button class="seg-btn active" data-fmt="zip">📦 ZIP 打包</button>
          <button class="seg-btn" data-fmt="files">🖼 图片文件</button>
        </div>
      </div>
      <div class="setting-group">
        <span class="set-label">保存到</span>
        <div class="seg" id="destSeg">
          <button class="seg-btn active" data-dest="browser">🌐 浏览器</button>
          <button class="seg-btn" data-dest="server">🖥 服务器</button>
        </div>
      </div>
      <button id="dlBtn" class="btn btn-primary btn-lg">⬇ 开始下载</button>
    </div>
    <div id="dlStatus" class="status-line"></div>

    <!-- 进度面板 -->
    <div id="progressPanel" class="progress-panel hidden">
      <div class="prog-head">
        <span id="progPhase">准备中…</span>
        <span id="progPct" class="prog-pct">0%</span>
      </div>
      <div class="prog-bar"><div id="progFill" class="prog-fill"></div></div>
      <div class="prog-meta">
        <span id="progDetail">0 / 0</span>
        <span id="progSpeed"></span>
        <span id="progElapsed"></span>
      </div>
      <div class="prog-errors hidden" id="progErrors"></div>
      <div class="prog-actions hidden" id="progActions">
        <a id="zipLink" class="btn btn-success" download>📦 下载 ZIP</a>
      </div>
    </div>

    <!-- 预览网格 -->
    <div class="grid-tools">
      <span>预览</span>
      <label class="chk"><input type="checkbox" id="showThumb" checked> 显示缩略图</label>
    </div>
    <div id="grid" class="grid"></div>
    <div id="gridCount" class="grid-count"></div>
  </section>

  <!-- 历史记录 -->
  <section class="card glass">
    <div class="result-head">
      <h3>🕘 历史任务</h3>
      <button class="btn btn-ghost btn-sm" id="historyClear">🗑 清除历史</button>
    </div>
    <div id="historyList" class="history-list"><p class="empty">暂无记录</p></div>
  </section>
</main>

<!-- 灯箱 -->
<div id="lightbox" class="lightbox hidden">
  <button class="lb-close" id="lbClose">✕</button>
  <button class="lb-nav lb-prev" id="lbPrev">‹</button>
  <img id="lbImg" alt="">
  <div class="lb-info"><span id="lbIdx"></span></div>
  <button class="lb-nav lb-next" id="lbNext">›</button>
</div>

<footer class="foot">cosplayD · 仅用于个人学习与收藏</footer>

<script src="static/js/theme.js?v=20260909"></script>
  <script src="static/js/scrollbtn.js?v=20260930"></script>
<script src="static/js/app.js?v=20260812"></script>
</body>
</html>
